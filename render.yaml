services:
  - type: web
    name: sea-battle-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_server.py & python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://sea-battle-bot.onrender.com
    healthCheckPath: /
