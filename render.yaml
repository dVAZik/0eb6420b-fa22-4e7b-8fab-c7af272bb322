services:
  - type: web
    name: hacker-simulator-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py & python web_server.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://hacker-simulator-bot.onrender.com
